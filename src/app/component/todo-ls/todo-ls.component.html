<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <h4 class="text-center bg-info p-2">Todo Form</h4>
                <div class="card-body">
                    <h2 >{{isIneditMode ? 'Update Todo' :' Add Todo'}}</h2>
                    <div class="form-group">
                        <label for="todoItem">Enter Todo Item<span class="text-danger">*</span></label>
                        <input type="text" class="form-control" #todoItem>

                        <label for="isCompleted">Complete Status<span class="text-danger">*</span></label>
                        <select class="form-control" #isCompleted>
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>

                        <div class="mt-3">
                            <button
                            (click)="onAddTodo()"
                            *ngIf="!isIneditMode"
                             class="w-100" mat-raised-button color="accent">Add Todo</button>
                            <button 
                            (click)="onUpdateTodo()"
                            *ngIf="isIneditMode"
                            class="w-100" mat-raised-button color="warn">Update Todo</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <ul class="list-group">
                        <li 
                        *ngFor="let todo of todosArr"
                        class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <input
                                [checked]="todo.isCompleted"
                                 type="checkbox" class="mr-2 p-5">

                                <strong>{{todo.todoItem}} <span 
                                    [ngClass]="{
                                       ' badge-success' : todo.isCompleted,
                                       'badge-danger' : !todo.isCompleted
                                    }"
                                    class="badge p-2">{{todo.isCompleted ? 'completed' : 'Pending'}}</span></strong>
                            </div>

                            <div>
                                <button 
                                (click)="onEditTodo(todo)"
                                mat-mini-fab color="accent" class="mr-2">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button 
                                (click)="onDeleteTodo(todo.todoId)"
                                mat-mini-fab color="warn">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
